[project]
name = "flightdeck-backend"
version = "0.1.0"
description = "FastAPI backend for the FlightDeck Declarative Gen-UI PoC"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "pydantic>=2.10.0",
  "uvicorn[standard]>=0.32.0",
]

[project.scripts]
flightdeck = "flightdeck.cli:main"

[dependency-groups]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flightdeck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

