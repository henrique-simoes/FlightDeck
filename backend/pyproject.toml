[project]
name = "flightdeck-backend"
version = "0.1.0"
description = "FastAPI backend for the FlightDeck Declarative Gen-UI PoC"
requires-python = ">=3.11"
dependencies = [
  "ag-ui-langgraph>=0.0.32",
  "copilotkit>=0.1.0",
  "fastapi>=0.116.0",
  "langchain>=1.0.0",
  "langchain-openai>=1.0.0",
  "langgraph>=1.0.0",
  "mcp-use>=1.7.0",
  "pydantic>=2.10.0",
  "uvicorn[standard]>=0.32.0",
]

[project.scripts]
flightdeck = "flightdeck.cli:main"
flightdeck-mcp = "flightdeck.mcp_server:main"

[dependency-groups]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flightdeck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
